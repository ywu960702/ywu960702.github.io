<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Private ASL evaluation results dashboard.">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>ASL Evaluation Results</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef2ef;
        color: #17352f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      .loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font-size: 15px;
        font-weight: 650;
        text-align: center;
      }

      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #eef2ef;
      }
    </style>
  </head>
  <body>
    <div class="loading" aria-live="polite">Loading secure results dashboard...</div>
    <iframe
      src="https://script.google.com/macros/s/AKfycbwczJ8KJ8GgBnC5BArm4TS3-aG0Em6aCSLaf4ELjQGWKqvDHsp4nHh34YTYBHcsnxE9/exec?admin=1"
      title="ASL evaluation results dashboard"
      referrerpolicy="no-referrer"
    ></iframe>
  </body>
</html>
